name: CI

# Runs on every push and pull request, whatever the default branch is called (this repo started on
# ccr-7aeb8ea1-63oetl, so a main-only filter meant CI never ran). Deploying to GitHub Pages is opt-in:
# it needs Pages enabled (source "GitHub Actions") and the repository variable DEPLOY_PAGES=true,
# and only happens for pushes to the default branch.
on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
