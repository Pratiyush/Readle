name: readle
description: "Learn German by reading short stories: tap any word, hear it, keep it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  google_mobile_ads: ^9.2.0
  app_tracking_transparency: ^2.0.7
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets/content is a symlink to the web app's public/content, so both apps ship the same
  # compiled stories and dictionary (built by tools/build_content.py) without a second copy in git.
  assets:
    - assets/content/
    - assets/content/stories/
    - assets/content/images/
    - assets/content/thumbs/
    - assets/content/audio/
    - assets/linker/
